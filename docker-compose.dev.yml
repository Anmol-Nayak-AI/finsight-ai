services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finsight-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finsight
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finsight"]
      interval: 4s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: finsight-backend-dev
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount backend folder for instant Python hot reloading
      - ./backend:/app
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:password@postgres:5432/finsight"
      DATABASE_CHECKPOINT_URL: "postgresql://postgres:password@postgres:5432/finsight"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LANGCHAIN_TRACING_V2: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: finsight-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for React HMR
      - ./frontend:/app
      # Anonymous volume prevents host node_modules from overwriting container node_modules
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_DEMO_MODE=true
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata_dev:
