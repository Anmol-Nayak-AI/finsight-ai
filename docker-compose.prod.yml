services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: finsight
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finsight"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      DEMO_MODE: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/finsight
      DATABASE_CHECKPOINT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/finsight
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost}
      MLRO_SHARMA_PASSWORD: ${MLRO_SHARMA_PASSWORD:?MLRO_SHARMA_PASSWORD is required}
      MLRO_SHARMA_TOTP_SEED: ${MLRO_SHARMA_TOTP_SEED:?MLRO_SHARMA_TOTP_SEED is required}
      MLRO_KAPOOR_PASSWORD: ${MLRO_KAPOOR_PASSWORD:?MLRO_KAPOOR_PASSWORD is required}
      MLRO_KAPOOR_TOTP_SEED: ${MLRO_KAPOOR_TOTP_SEED:?MLRO_KAPOOR_TOTP_SEED is required}
      ANALYST_VERMA_PASSWORD: ${ANALYST_VERMA_PASSWORD:?ANALYST_VERMA_PASSWORD is required}
      ANALYST_VERMA_TOTP_SEED: ${ANALYST_VERMA_TOTP_SEED:?ANALYST_VERMA_TOTP_SEED is required}
      REGULATOR_IYER_PASSWORD: ${REGULATOR_IYER_PASSWORD:?REGULATOR_IYER_PASSWORD is required}
      REGULATOR_IYER_TOTP_SEED: ${REGULATOR_IYER_TOTP_SEED:?REGULATOR_IYER_TOTP_SEED is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: "false"
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      BACKEND_HOSTPORT: backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_prod:
