name: CI

on:
  push:
    branches: [main, feature/compliance-engine]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: finsight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finsight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/finsight_test
      DATABASE_CHECKPOINT_URL: postgresql://postgres:ci-only-password@localhost:5432/finsight_test
      OPENAI_API_KEY: ""
      APP_ENV: development
      DEMO_MODE: "true"
      RUN_POSTGRES_INTEGRATION_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt httpx
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
