# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: finsight-ai-compliance-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render-free
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_LEDGER_IF_EMPTY
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: finsight-ai-compliance-db
          property: connectionString
      - key: DATABASE_CHECKPOINT_URL
        fromDatabase:
          name: finsight-ai-compliance-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://finsight-ai-compliance-demo.onrender.com
      - key: MLRO_SHARMA_PASSWORD
        sync: false
      - key: MLRO_SHARMA_TOTP_SEED
        sync: false
      - key: MLRO_KAPOOR_PASSWORD
        sync: false
      - key: MLRO_KAPOOR_TOTP_SEED
        sync: false
      - key: ANALYST_VERMA_PASSWORD
        sync: false
      - key: ANALYST_VERMA_TOTP_SEED
        sync: false
      - key: REGULATOR_IYER_PASSWORD
        sync: false
      - key: REGULATOR_IYER_TOTP_SEED
        sync: false

databases:
  - name: finsight-ai-compliance-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: finsight
    user: finsight
    ipAllowList: []
